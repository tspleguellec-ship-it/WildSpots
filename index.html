<!-- ========== NOUVEAU HERO (remplace l'ancien .hero) ========== -->
<section class="hero-new" id="hero">
  <div class="hero-new-inner">
    
    <!-- Eyebrow -->
    <p class="hero-eyebrow">
      <span class="hero-eyebrow-line"></span>
      Landes &amp; Pays Basque · Surf · Kite · Wind · Wingfoil
    </p>

    <!-- Titre -->
    <h1 class="hero-title">
      Trouve le spot<br>
      parfait en <em>2 minutes</em>
    </h1>

    <!-- Sous-titre -->
    <p class="hero-subtitle">
      Conditions, hébergement, école et avis riders — tout au même endroit.
    </p>

    <!-- CTAs -->
    <div class="hero-actions">
      <a href="#map-section" class="btn-hero-primary" id="cta-explore-map">
        Explorer la carte
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
      <button type="button" class="btn-hero-secondary" id="cta-recommended">
        Voir les spots recommandés
      </button>
    </div>

    <!-- Micro-preuve -->
    <div class="hero-proof">
      <span class="hero-proof-item">25 spots</span>
      <span class="hero-proof-dot">·</span>
      <span class="hero-proof-item">Validés par la communauté</span>
    </div>

  </div>
</section>
